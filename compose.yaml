services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  pulse-a:
    build: .
    environment: &pulse-environment
      PULSE_INSTANCE_ID: a
      PULSE_JWT_SECRET: compose-demo-secret-change-me-32-bytes
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulse
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    ports:
      - "8081:8080"
    depends_on: &pulse-dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  pulse-b:
    build: .
    environment:
      <<: *pulse-environment
      PULSE_INSTANCE_ID: b
    ports:
      - "8082:8080"
    depends_on: *pulse-dependencies

volumes:
  postgres-data:
