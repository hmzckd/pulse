spring.application.name=pulse

server.port=${PORT:8080}

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://localhost:5437/pulse
spring.datasource.username=pulse
spring.datasource.password=pulse

spring.mvc.problemdetails.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6380

pulse.instance-id=${PULSE_INSTANCE_ID:}

pulse.ws.ping-interval=25s
pulse.ws.pong-timeout=60s

pulse.jwt.secret=${PULSE_JWT_SECRET}
pulse.jwt.ttl=1h
